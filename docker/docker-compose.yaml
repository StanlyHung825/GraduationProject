services:
  bbsmg:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bbsmg
    image: bbsmg-phase1:latest
    container_name: bbsmg_phase1
    command: /bin/bash
    tty: true
    network_mode: host
    stdin_open: true
    stop_grace_period: 1s

    volumes:
      - ../BBSMG_ws:/BBSMG_ws

    working_dir:
      /BBSMG_ws

  gpa:
    build: .
    image: gpa:latest
    container_name: gpa
    command: /bin/bash
    tty: true
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    stop_grace_period: &STOP_GRACE_PERIOD 1s

    volumes:
      - ../ros2ws:/home/user/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/home/user/.Xauthority
      - /dev:/dev
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    working_dir:
      /home/user/ws

    environment:
      - DISPLAY=${DISPLAY}  # Set display environment variable
      - RCUTILS_COLORIZED_OUTPUT=1
      - XAUTHORITY=/home/user/.Xauthority   # Set Xauthority path
      - ROS_DOMAIN_ID=0  # ! Please distinguish the domain ID with other containers
